name: CI

on:
  push:
    branches: [main]
  pull_request:

# Installs are lockfile-exact (`npm ci`, `forge install --frozen`) so a green
# run means the committed dependency set builds, not that some newer one did.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (Foundry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      # Dependencies are vendored under contracts/lib, so there is nothing to
      # fetch — which is also what makes the build reproducible.
      - name: Build
        working-directory: contracts
        run: forge build --sizes
      - name: Test
        working-directory: contracts
        run: forge test -vv

  backend:
    name: Backend (services/live-room)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The service reads compiled ABIs and bytecode out of contracts/out —
      # src/indexer/abi.mjs does, and the tests import it — so the contracts
      # have to be built before the suite runs. A developer's machine usually
      # has out/ lying around from an earlier build, which is exactly why this
      # was missed locally and only failed on a clean checkout.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      - name: Build contracts, whose artifacts the service loads
        working-directory: contracts
        run: forge build
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14'
          cache: npm
          cache-dependency-path: services/live-room/package-lock.json
      - run: npm ci
        working-directory: services/live-room
      - run: npm test
        working-directory: services/live-room

  frontend:
    name: Frontend (prototype/live-market-app)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14'
          cache: npm
          cache-dependency-path: prototype/live-market-app/package-lock.json
      - run: npm ci
        working-directory: prototype/live-market-app
      # `npm test` builds first (pretest), because one test asserts on the
      # packaged output. A fresh checkout has no dist/.
      - run: npm test
        working-directory: prototype/live-market-app

  gameday:
    name: Game day (anvil, end to end)
    runs-on: ubuntu-latest
    needs: [contracts, backend]
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1
      # All three tiers deploy real contracts and load their bytecode from
      # contracts/out. README says so; CI did not do it, and the first public
      # run died on a missing MockUSDC artifact.
      - name: Build contracts, whose bytecode the game day deploys
        working-directory: contracts
        run: forge build
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14'
          cache: npm
          cache-dependency-path: services/live-room/package-lock.json
      - run: npm ci
        working-directory: services/live-room
      # Three tiers, narrowest first. The multiprocess tier is the only one
      # that runs the operator roles as real spawned OS processes.
      - run: npm run gameday:anvil
        working-directory: services/live-room
      - run: npm run live-gameday:anvil
        working-directory: services/live-room
      - run: npm run multiprocess-gameday:anvil
        working-directory: services/live-room
